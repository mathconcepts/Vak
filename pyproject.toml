[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vak-studio"
version = "0.1.0"
description = "Vāk Studio: turn a prayer text + recording into a word-timed Reader file. Model-agnostic MCP harness."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "numba>=0.59", "torch>=2.2", "transformers>=4.40", "huggingface_hub>=0.23",
  "uroman>=1.3", "faster-whisper>=1.0", "imageio-ffmpeg>=0.5", "playwright>=1.44",
  "mcp>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vak = "vakstudio.cli:main"
vak-mcp = "vakstudio.mcp_server:main"

[tool.setuptools]
packages = ["vakstudio"]
